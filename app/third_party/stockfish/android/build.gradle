// Patched for AGP 9 (see app/third_party/README.md): removed the legacy
// buildscript block (AGP 3.5 classpath + jcenter) and renamed lintOptions.
group 'com.stockfish'
version '1.0'

apply plugin: 'com.android.library'

android {
    namespace 'com.arjanaswal.stockfish'

    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }
    lint {
        disable 'InvalidPackage'
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}
